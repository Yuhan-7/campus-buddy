services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus_buddy
      MYSQL_USER: buddy
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/campus_buddy?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: buddy
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DEMO_DATA: ${DEMO_DATA:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  mysql_data:
